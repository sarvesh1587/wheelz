services:
  - type: web
    name: wheelz-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SITE_URL
        value: https://wheelz-sand.vercel.app
      - key: EMAIL_FROM
        value: hm2300439@gmail.com
      - key: ADMIN_EMAIL
        value: hm2300439@gmail.com
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
